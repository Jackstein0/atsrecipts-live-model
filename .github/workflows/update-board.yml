name: Update MLB Model Board

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: atsrecipts-upload-ready
        run: pip install -r requirements.txt

      - name: Update model board
        working-directory: atsrecipts-upload-ready
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          PUBLIC_REPORT: ../index.html
          LOCAL_REPORT: data/processed/model_report.html
        run: bash scripts/update_all_model_boards.sh

      - name: Commit updated board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html atsrecipts-upload-ready/data/processed atsrecipts-upload-ready/data/raw atsrecipts-upload-ready/data/source
          git diff --cached --quiet && echo "No board changes to commit" || git commit -m "Auto-update MLB model board"
          git push
